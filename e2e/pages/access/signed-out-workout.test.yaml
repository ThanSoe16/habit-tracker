fileType: 'momentic/test/v2'
id: 'one-eleven-younger-prefers-strictly'
description: 'Signed out workout'
defaultEnv: 'local'
steps:
  - navigate: '/workout/today'
  - waitForUrl: '/login?next='
  - checkPageContains: 'Your personal tracker'
  - assert: 'The protected route redirects to login with a next parameter preserving the requested destination. Protected content is not visible. A loading skeleton, query error, or application error does not satisfy this check.'
