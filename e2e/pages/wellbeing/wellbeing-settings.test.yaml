fileType: 'momentic/test/v2'
id: 'sturdy-spicy-paint-dries-keenly'
description: 'Wellbeing settings'
defaultEnv: 'local'
before:
  - module: '../../modules/authenticated-session.module.yaml'
steps:
  - navigate: '/digital-wellbeing/settings'
  - waitForUrl: '/digital-wellbeing/settings'
  - checkPageContains: 'Daily screen-time goal'
  - checkPageContains: 'Daily focus goal'
  - checkPageContains: 'Usage Alerts'
  - checkPageContains: 'Privacy'
  - checkPageContains: 'Delete wellbeing history'
  - assert: 'Settings are loaded. Unavailable usage-alert and native permission switches are disabled; Save settings is disabled with no changes. A loading skeleton, query error, or application error does not satisfy this check.'
  - click: 'Delete wellbeing history button'
  - checkPageContains: 'Delete wellbeing history?'
  - click: 'Cancel button in the delete history confirmation'
  - assert: 'The confirmation dialog is closed and wellbeing settings remain visible. No history was deleted.'
