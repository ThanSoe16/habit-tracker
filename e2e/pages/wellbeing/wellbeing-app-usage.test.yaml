fileType: 'momentic/test/v2'
id: 'small-legal-thin-steer-uphill'
description: 'Wellbeing app usage'
defaultEnv: 'local'
before:
  - module: '../../modules/authenticated-session.module.yaml'
steps:
  - navigate: '/digital-wellbeing/app-usage'
  - waitForUrl: '/digital-wellbeing/app-usage'
  - checkPageContains: 'Today'
  - checkPageContains: '7 days'
  - checkPageContains: '30 days'
  - checkPageContains: 'Total'
  - checkPageContains: 'Daily Avg'
  - checkPageContains: 'Individual Apps'
  - assert: 'Usage metrics and app records or No app activity yet are loaded. A loading skeleton, query error, or application error does not satisfy this check.'
  - click: '7 days date range button'
  - assert: 'The 7 days range is selected and usage figures or the no-activity state are shown.'
  - click: '30 days date range button'
  - assert: 'The 30 days range is selected and usage figures or the no-activity state are shown.'
