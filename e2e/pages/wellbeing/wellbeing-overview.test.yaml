fileType: 'momentic/test/v2'
id: 'jaunty-lovely-pet-expects-eagerly'
description: 'Wellbeing overview'
defaultEnv: 'local'
before:
  - module: '../../modules/authenticated-session.module.yaml'
steps:
  - navigate: '/digital-wellbeing'
  - waitForUrl: '/digital-wellbeing'
  - checkPageContains: 'Screen Time'
  - checkPageContains: 'Focus Time'
  - checkPageContains: 'Phone Pickups'
  - checkPageContains: 'Notifications'
  - checkPageContains: 'Daily Goal'
  - checkPageContains: 'Most Used Apps'
  - assert: 'Wellbeing metrics and a daily goal are loaded, with app usage or an empty state. A loading skeleton, query error, or application error does not satisfy this check.'
  - click: 'Start Focus Mode button'
  - waitForUrl: '/digital-wellbeing/focus'
  - checkPageContains: 'Start Focus Session'
