fileType: 'momentic/test/v2'
id: 'small-final-suit-scamper-casually'
description: 'Workout weight goal'
defaultEnv: 'local'
before:
  - module: '../../modules/authenticated-session.module.yaml'
steps:
  - navigate: '/workout/weight-progress'
  - waitForUrl: '/workout/weight-progress'
  - checkPageContains: 'Target Weight'
  - checkPageContains: 'Deadline'
  - checkPageContains: 'Reminder'
  - checkPageContains: 'Set Goal'
  - assert: 'Current weight and goal configuration are rendered. A loading skeleton, query error, or application error does not satisfy this check.'
  - click: 'Target Weight configuration row'
  - checkPageContains: 'Set Target Weight'
  - act:
      goal: 'Close the open target weight dialog using its close button or Escape. Do not save, submit, delete, or change any existing record.'
      postcondition: 'The target weight dialog is closed and the underlying page is usable.'
