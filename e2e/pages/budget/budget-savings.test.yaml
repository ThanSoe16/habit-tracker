fileType: 'momentic/test/v2'
id: 'green-splendid-want-intends-godly'
description: 'Budget savings'
defaultEnv: 'local'
before:
  - module: '../../modules/authenticated-session.module.yaml'
steps:
  - navigate: '/budget/savings'
  - waitForUrl: '/budget/savings'
  - checkPageContains: 'Savings'
  - checkPageContains: 'New saving'
  - checkPageContains: 'Savings are separate from Available'
  - assert: 'Savings records or Start your first saving is shown. A loading skeleton, query error, or application error does not satisfy this check.'
  - click: 'New saving button'
  - assert: 'A savings form is open with a name or title, amount, and saving or unlock configuration.'
  - act:
      goal: 'Close the open saving dialog using its close button or Escape. Do not save, submit, delete, or change any existing record.'
      postcondition: 'The saving dialog is closed and the underlying page is usable.'
