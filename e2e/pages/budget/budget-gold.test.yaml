fileType: 'momentic/test/v2'
id: 'thirtytwo-superb-lungs-foster-nimbly'
description: 'Budget gold'
defaultEnv: 'local'
before:
  - module: '../../modules/authenticated-session.module.yaml'
steps:
  - navigate: '/budget/gold'
  - waitForUrl: '/budget/gold'
  - checkPageContains: 'GOLD HOLDINGS'
  - checkPageContains: 'Buy Gold'
  - checkPageContains: 'Active cost'
  - assert: 'Gold balances and records or No gold records yet are loaded. A loading skeleton, query error, or application error does not satisfy this check.'
  - click: 'Buy Gold button'
  - checkPageContains: 'Record Gold Purchase'
  - checkPageContains: 'Gold weight'
  - checkPageContains: 'Total purchase price'
  - act:
      goal: 'Close the open gold purchase drawer using its close button or Escape. Do not save, submit, delete, or change any existing record.'
      postcondition: 'The gold purchase drawer is closed and the underlying page is usable.'
