[package]
name = "habit-tracker"
version = "0.1.0"
description = "Offline goal tracker"
edition = "2021"

[lib]
name = "habit_tracker_lib"
crate-type = ["staticlib", "cdylib", "rlib"]

[build-dependencies]
tauri-build = { version = "2", features = [] }

[dependencies]
tauri = { version = "~2.11", features = [] }
tauri-plugin-sql = { version = "~2.4", features = ["sqlite"] }
